<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Design Task Tracker</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      padding: 14px;
      width: 300px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24292f;
      background: #fff;
    }
    h1 { margin: 0 0 10px; font-size: 14px; }
    .counts {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 8px;
      padding: 10px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .counts b { text-align: right; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    button {
      flex: 1;
      padding: 7px 10px;
      font: inherit;
      font-weight: 600;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    button.primary { background: #1f883d; border-color: #1f883d; color: #fff; }
    button.primary:hover { background: #1a7f37; }
    .hint { color: #57606a; font-size: 11px; margin: 0 0 10px; }
    .warn {
      color: #9a6700;
      background: #fff8c5;
      border: 1px solid #d4a72c;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    #status { font-size: 11px; min-height: 16px; color: #1a7f37; }
    #status.err { color: #cf222e; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <h1>Design Task Tracker</h1>

  <div class="counts" id="counts"></div>

  <div class="warn">
    ⚠️ 卸载扩展会清空所有状态记录。换电脑或重装前，请先「导出备份」。
  </div>

  <div class="row">
    <button id="export" class="primary">导出备份</button>
    <button id="import">导入备份</button>
  </div>
  <p class="hint">导入为合并模式：同一 issue 以备份文件中的状态为准，其余保留。</p>

  <div id="status"></div>
  <input type="file" id="file" accept="application/json,.json" />

  <script src="popup.js"></script>
</body>
</html>
